      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SportsFly",
      "alternateName": "SportsFly Spor Okulu ve Akademi Yönetim Sistemi",
      "url": "https://webapp.sportsfly.com.tr/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "Spor okulları, akademiler ve kulüpler için yeni nesil yönetim yazılımı. Otomatik aidat tahsilatı, mobil yoklama, eğitmen ve veli panelleri, Sporpuan ödül sistemi ve dijital sporcu karneleri.",
      "areaServed": {
        "@type": "Country",
        "name": "Türkiye"
      },
      "offers": {
        "@type": "Offer",
        "price": "1190",
        "priceCurrency": "TRY"
      }
    }
    </script>
    <!-- Global Window Error & Vite Preload Failure Trap -->
    <script>
      window.__sportsfly_boot_start = Date.now();
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[SportsFly] Vite preload error detected, refreshing stale chunks...', event);
        var reloadCount = parseInt(sessionStorage.getItem('sportsfly_chunk_reload_count') || '0', 10);
        if (reloadCount < 2) {
          sessionStorage.setItem('sportsfly_chunk_reload_count', (reloadCount + 1).toString());
          window.location.reload();
        }
      });

      window.addEventListener('error', function(e) {
        if (e && e.message && (
          e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          e.message.indexOf('Importing a module script failed') !== -1
        )) {
          var reloadCount = parseInt(sessionStorage.getItem('sportsfly_chunk_reload_count') || '0', 10);
          if (reloadCount < 2) {
            sessionStorage.setItem('sportsfly_chunk_reload_count', (reloadCount + 1).toString());
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-blue-100 selection:text-blue-900">
    <div id="root">
      <div id="sportsfly-preloader" style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1320;color:#f8fafc;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;box-sizing:border-box;">
        <style>
          @keyframes sportsflyPulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.06); opacity: 1; }
          }
          @keyframes sportsflyBar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(25%); }
            100% { transform: translateX(200%); }
          }
          .sf-pulse { animation: sportsflyPulse 2.4s ease-in-out infinite; }
          .sf-bar { animation: sportsflyBar 1.6s ease-in-out infinite; }
        </style>
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:420px;width:100%;">
          <div class="sf-pulse" style="width:72px;height:72px;margin-bottom:20px;filter:drop-shadow(0 10px 20px rgba(37,99,235,0.35));">
            <img src="/sportsfly-logo.svg" alt="SportsFly Logo" width="72" height="72" style="width:100%;height:100%;object-fit:contain;" />
          </div>
          <div style="font-size:22px;font-weight:800;letter-spacing:-0.03em;color:#ffffff;margin-bottom:6px;">
            SportsFly
          </div>
          <div style="font-size:12px;font-weight:600;color:#94a3b8;letter-spacing:0.02em;text-transform:uppercase;margin-bottom:24px;">
            Spor Okulu, Akademi &amp; Kulüp Yönetim Sistemi
          </div>
          <div style="width:180px;height:4px;background:#1e293b;border-radius:9999px;overflow:hidden;position:relative;margin-bottom:14px;">
            <div class="sf-bar" style="position:absolute;top:0;left:0;width:50%;height:100%;background:linear-gradient(90deg,#0284c7,#2563eb,#60a5fa);border-radius:9999px;"></div>
          </div>
          <div id="sportsfly-preloader-text" style="font-size:12px;color:#64748b;font-weight:500;">
            Sistem arayüzü başlatılıyor...
          </div>

          <!-- Fallback rescue button in case of network lag / stale chunk (>4s) -->
          <div id="sportsfly-rescue-panel" style="display:none;margin-top:28px;padding:16px 20px;background:#111c2e;border:1px solid #1e293b;border-radius:14px;box-shadow:0 12px 24px -6px rgba(0,0,0,0.4);">
            <div style="font-size:12px;color:#cbd5e1;font-weight:600;margin-bottom:12px;line-height:1.4;">
              Panel açılışı beklenenden uzun sürdü. Tarayıcı önbelleğini yenileyerek doğrudan açabilirsiniz:
            </div>
            <button
              type="button"
              onclick="try{sessionStorage.clear();localStorage.removeItem('sportsfly_active_page');}catch(e){}window.location.reload();"
              style="display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;background:#2563eb;color:#ffffff;font-size:12px;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:background 0.2s;"
              onmouseover="this.style.background='#1d4ed8'"
              onmouseout="this.style.background='#2563eb'"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
              <span>Önbelleği Temizle &amp; Paneli Aç</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var timer = setTimeout(function() {
          var rescue = document.getElementById('sportsfly-rescue-panel');
          var text = document.getElementById('sportsfly-preloader-text');
          if (text) text.innerText = 'Modüller yükleniyor...';
          if (rescue) rescue.style.display = 'block';
        }, 3800);
        window.__sportsfly_clear_preloader_timer = function() {
          clearTimeout(timer);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
